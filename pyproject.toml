[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyria-auto-publisher"
version = "1.0.0"
description = "Automated Lyria 3 music generation and YouTube publishing pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "google-genai>=2.13.0,<3",
  "google-api-python-client>=2.0.0",
  "google-auth-oauthlib>=1.0.0",
  "google-auth-httplib2>=0.2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "python-dotenv>=1.0",
  "APScheduler>=3.10,<4",
  "ImageHash>=4.3.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
lyria-auto = "lyria_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "comfyui-assets"]
testpaths = ["tests"]
