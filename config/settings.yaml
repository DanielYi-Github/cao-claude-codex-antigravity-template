generation:
  max_generation_attempts: 3
  max_material_minutes: 60
  max_tracks_per_video: 40
  model: lyria-3-pro-preview
  output_format: mp3
  prompt_profile: coffeehouse_lofi_jazz
  provider: lyria
  request_delay_seconds: 3
  safe_rewrite_on_block: true
metadata:
  description_template: '{scene}｜咖啡廳爵士，適合讀書、工作、閱讀與深度專注。


    🎹 編制：{instrumentation}

    🌿 氛圍：{mood}

    ⏱️ 內容長度：約 {duration_minutes} 分鐘


    本音樂由 AI 輔助生成並經過自動化音訊處理與品質檢查。


    #LofiJazz #CoffeeShopJazz #StudyMusic #FocusMusic

    '
  language: zh-TW
  tags:
  - lofi jazz
  - coffee shop jazz
  - study music
  - focus music
  - work music
  - 咖啡廳音樂
  - 讀書音樂
  - 專注音樂
  title_template: '{scene} ☕ 咖啡廳爵士｜讀書・專注・工作音樂 No.{episode:03d}'
project:
  database: workspace/state.sqlite3
  logs: logs
  name: Coffeehouse Lofi Jazz
  random_seed: 20260726
  timezone: Asia/Taipei
  workspace: workspace
quality:
  loudness_target_lufs: -16
  max_recent_prompt_signatures: 100
  minimum_duration_seconds: 20
  minimum_sample_rate: 44100
  normalize_audio: true
  require_stereo: true
  true_peak_db: -1.5
scheduler:
  channel: main
  cron: 0 9 * * 1,4
  enabled: false
  upload: true
  videos_per_run: 1
studio:
  comfyui_base_url: http://127.0.0.1:8188
  comfyui_remote_base_url: ''
  chowchow_reference_path: comfyui-assets/character-reference/chowchow/approved/master-lying-transparent-v1.png
  comfyui_workflows_dir: comfyui-assets/workflows/api
  # 12-in-one-submission at 1280x720 is UNTESTED on real hardware -- the
  # checked-in workflow's own default is 4, and comfyui-assets/README.md
  # documents 4-at-1280x720 already pushing memory/time above a single
  # image. If a real run OOMs or times out, lower this (e.g. to 4) rather
  # than assuming the code is wrong -- studio-console-v2-plan.md.
  keyframe_batch_size: 12
  # --- Google Veo 動作生成路徑（artifacts/spec.md）---
  # 頁籤 2 的「生成來源」下拉切到 Veo 時使用。本機 ComfyUI 路徑不受影響。
  veo:
    enabled: true
    default_model: veo-3.1-fast-generate-preview
    default_resolution: 720p
    # poll_veo_motion 每次重新排隊之間的等待秒數。Veo 一支 8 秒片段
    # 通常要 1-3 分鐘，查太密只是浪費 API 額度。
    poll_interval_seconds: 15
    # 一集最多允許幾次 Veo 付費啟動（sleep + lookup 各算一次）。
    # 純粹是防手滑的上限，不是配額。
    max_starts_per_episode: 12
    # ⚠️ usd_per_second 全部是「未校對的估價快照」，不是查證過的官方報價。
    # UI 一律標示為「預估」。首次真機執行後請人工對帳並更新這裡與
    # pricing_snapshot_date。Google 隨時可能調價或改模型代號。
    pricing_snapshot_date: '2026-09-06'
    pricing_verified: false
    models:
      - id: veo-3.1-fast-generate-preview
        label: Veo 3.1 Fast（速度優先）
        resolutions: [720p, 1080p]
        durations: [4, 6, 8]
        supports_last_frame: true
        usd_per_second: 0.15
      - id: veo-3.1-generate-preview
        label: Veo 3.1（品質優先）
        resolutions: [720p, 1080p]
        durations: [4, 6, 8]
        supports_last_frame: true
        usd_per_second: 0.40
      - id: veo-3.0-fast-generate-001
        label: Veo 3.0 Fast（穩定版）
        resolutions: [720p, 1080p]
        durations: [8]
        supports_last_frame: false
        usd_per_second: 0.15
      - id: veo-3.0-generate-001
        label: Veo 3.0（穩定版）
        resolutions: [720p, 1080p]
        durations: [8]
        supports_last_frame: false
        usd_per_second: 0.40
video:
  audio_bitrate: 256k
  background_directory: assets/backgrounds
  crossfade_seconds: 2
  default_background_mode: generated
  fps: 1
  height: 1080
  target_duration_minutes: 120
  thumbnail_height: 720
  thumbnail_quality: 88
  thumbnail_width: 1280
  title_overlay: true
  video_preset: veryfast
  width: 1920
visual:
  aspect_ratio: '16:9'
  enabled: false
  estimated_budget_usd: 10.0
  image_2k_estimated_usd: 0.101
  image_candidates_per_scene: 3
  image_model: gemini-3.1-flash-image
  image_size: 2K
  max_image_outputs: 14
  max_thumbnail_backgrounds: 1
  max_unique_scenes: 4
  max_video_outputs: 8
  max_world_anchor_images: 1
  poll_interval_seconds: 10
  preflight:
    max_image_outputs: 1
    max_video_outputs: 1
    valid_days: 30
  pricing_snapshot_date: '2026-07-29'
  provider: gemini-developer-api
  quality:
    duration_tolerance_seconds: 0.25
    motion_max_normalized_mae: 0.1
    motion_min_normalized_mae: 0.002
    seam_max_normalized_mae: 0.06
  scene_interval_minutes: 30
  video_1080p_second_estimated_usd: 0.12
  video_candidates_per_scene: 2
  video_duration_seconds: 8
  video_fps: 24
  video_model: veo-3.1-fast-generate-preview
  video_resolution: 1080p
