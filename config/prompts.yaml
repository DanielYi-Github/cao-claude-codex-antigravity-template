      - "warm analog mix, natural acoustic space, gentle compression"
      - "clean low-end, soft transients, restrained high frequencies"
      - "intimate jazz recording, balanced instrumentation, airy soundstage"
    # 刻意不指定秒數：實測不提長度會拿到約 173 秒（接近模型上限），
    # 而要求「150 秒」只會拿到 144 秒。計費是按「首」算、與長度無關，
    # 所以指定較短的秒數等於同樣的錢買到更少音樂。
    outputs:
      - "Instrumental only. No vocals and no spoken words. Create a fully original composition suitable for studying and deep focus."

